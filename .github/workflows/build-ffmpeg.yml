name: Build FFmpeg DRM PRIME Diagnostic

on:
  workflow_dispatch:

jobs:
  build-ffmpeg:
    name: Build FFmpeg 4.4.2 DRM PRIME ARM64
    runs-on: ubuntu-22.04-arm

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ============================================================
      # 2. Verify runner architecture
      # ============================================================
      - name: Verify runner architecture
        shell: bash
        run: |
          set -eux

          echo "=== System ==="
          uname -a

          echo
          echo "=== Machine architecture ==="
          uname -m

          echo
          echo "=== Debian architecture ==="
          dpkg --print-architecture

          echo
          echo "=== CPU ==="
          nproc
          lscpu | head -n 25

          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"

      # ============================================================
      # 3. Enable Debian source repositories
      # ============================================================
      - name: Enable source repositories
        shell: bash
        run: |
          set -eux

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i \
              's/^Types: deb$/Types: deb deb-src/' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi

          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i \
              's/^# *deb-src /deb-src /' \
              /etc/apt/sources.list
          fi

          echo
          echo "=== Source repositories ==="
          grep -R "deb-src" \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/ \
            || true

          sudo apt-get update

      # ============================================================
      # 4. Install build dependencies
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get build-dep -y ffmpeg

          sudo apt-get install -y \
            build-essential \
            devscripts \
            quilt \
            fakeroot \
            git \
            ca-certificates \
            curl \
            python3

      # ============================================================
      # 5. Download exact Ubuntu Jammy FFmpeg source
      # ============================================================
      - name: Download FFmpeg 4.4.2 source
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/build"

          cd "$HOME/build"

          apt-get source ffmpeg=7:4.4.2-0ubuntu0.22.04.1

          echo
          echo "=== Build directory ==="
          ls -lah

          test -d ffmpeg-4.4.2

      # ============================================================
      # 6. Verify source version
      # ============================================================
      - name: Verify FFmpeg source version
        shell: bash
        run: |
          set -eux

          cd "$HOME/build/ffmpeg-4.4.2"

          echo "=== Debian source version ==="
          dpkg-parsechangelog \
            -S Version \
            -l debian/changelog

          VERSION="$(dpkg-parsechangelog \
            -S Version \
            -l debian/changelog)"

          echo "VERSION=$VERSION"

          case "$VERSION" in
            7:4.4.2-0ubuntu0.22.04.1)
              echo "Correct FFmpeg Jammy source."
              ;;
            *)
              echo "ERROR: Unexpected FFmpeg version: $VERSION"
              exit 1
              ;;
          esac

      # ============================================================
      # 7. Download LibreELEC V4L2 DRM PRIME patch
      # ============================================================
      - name: Download V4L2 DRM PRIME patch
        shell: bash
        run: |
          set -eux

          cd "$HOME/build/ffmpeg-4.4.2"

          export QUILT_PATCHES=debian/patches

          mkdir -p debian/patches

          curl -fL \
            -o debian/patches/v4l2-drmprime.patch \
            https://raw.githubusercontent.com/LibreELEC/LibreELEC.tv/libreelec-11.0/packages/multimedia/ffmpeg/patches/v4l2-drmprime/ffmpeg-001-v4l2-drmprime.patch

          echo
          echo "=== Downloaded patch ==="
          ls -lh debian/patches/v4l2-drmprime.patch

          test -s debian/patches/v4l2-drmprime.patch

          echo "v4l2-drmprime.patch" >> debian/patches/series

          echo
          echo "=== Patch series ==="
          cat debian/patches/series

          echo
          echo "=== Applying patch ==="
          quilt push

          echo
          echo "=== Applied patches ==="
          quilt applied

      # ============================================================
      # 8. Force FFmpeg CLI to select DRM PRIME
      #
      # IMPORTANT:
      # This modification affects the ffmpeg CLI diagnostic program.
      # Kodi itself does NOT use this fftools/ffmpeg.c code.
      #
      # The LibreELEC patch above is what adds V4L2 DRM PRIME support
      # to libavcodec.
      # ============================================================
      - name: Force DRM PRIME in ffmpeg CLI
        shell: bash
        run: |
          set -eux

          cd "$HOME/build/ffmpeg-4.4.2"

          python3 <<'PY'
          from pathlib import Path

          path = Path("fftools/ffmpeg.c")
          text = path.read_text()

          needle = """static enum AVPixelFormat get_format(AVCodecContext *s, const enum AVPixelFormat *pix_fmts)
          {
              InputStream *ist = s->opaque;
              const enum AVPixelFormat *p;
              int ret;
          """

          insert = """    for (p = pix_fmts; *p != AV_PIX_FMT_NONE; p++) {
              if (*p == AV_PIX_FMT_DRM_PRIME) {
                  av_log(s, AV_LOG_INFO, "TEST: forcing DRM_PRIME\\\\n");
                  return AV_PIX_FMT_DRM_PRIME;
              }
          }

          """

          if "TEST: forcing DRM_PRIME" in text:
              raise SystemExit(
                  "ERROR: DRM PRIME force code already exists. "
                  "Refusing to insert twice."
              )

          if needle not in text:
              raise SystemExit(
                  "ERROR: Could not find expected get_format() "
                  "function body. Refusing to modify source."
              )

          text = text.replace(
              needle,
              needle + insert,
              1
          )

          path.write_text(text)
          PY

          echo
          echo "=== Modified get_format() ==="

          grep -n -A12 -B5 \
            'TEST: forcing DRM_PRIME' \
            fftools/ffmpeg.c

      # ============================================================
      # 9. Verify DRM PRIME patch + forced code
      # ============================================================
      - name: Verify source modifications
        shell: bash
        run: |
          set -eux

          cd "$HOME/build/ffmpeg-4.4.2"

          echo "=== Quilt status ==="
          quilt applied

          echo
          echo "=== DRM PRIME references ==="

          grep -n -E \
            'DRM_PRIME|drm_prime|v4l2.*drm' \
            libavcodec/v4l2_m2m_dec.c \
            libavcodec/v4l2_context.c \
            libavcodec/v4l2_buffers.c

          echo
          echo "=== Forced DRM PRIME code ==="

          grep -n -A8 -B4 \
            'TEST: forcing DRM_PRIME' \
            fftools/ffmpeg.c

          echo
          echo "=== Sanity checks ==="

          grep -q \
            'TEST: forcing DRM_PRIME' \
            fftools/ffmpeg.c

          grep -q \
            'AV_PIX_FMT_DRM_PRIME' \
            libavcodec/v4l2_m2m_dec.c

      # ============================================================
      # 10. Build Debian packages
      # ============================================================
      - name: Build FFmpeg packages
        shell: bash
        run: |
          set -eux

          cd "$HOME/build/ffmpeg-4.4.2"

          export DEB_BUILD_OPTIONS="parallel=4"

          dpkg-buildpackage \
            -b \
            -uc \
            -us

      # ============================================================
      # 11. Verify generated packages are ARM64
      # ============================================================
      - name: Verify generated packages
        shell: bash
        run: |
          set -eux

          cd "$HOME/build"

          echo
          echo "=== Generated Debian packages ==="
          ls -lh *.deb

          echo
          echo "=== Package architectures ==="

          for pkg in *.deb; do
            echo
            echo "----------------------------------------"
            echo "$pkg"
            dpkg-deb -f "$pkg" Package
            dpkg-deb -f "$pkg" Version
            dpkg-deb -f "$pkg" Architecture
          done

          echo
          echo "=== Checking architectures ==="

          for pkg in *.deb; do
            ARCH="$(dpkg-deb -f "$pkg" Architecture)"

            if [ "$ARCH" != "arm64" ]; then
              echo "ERROR: $pkg is $ARCH, expected arm64"
              exit 1
            fi
          done

          echo
          echo "ALL PACKAGES ARE ARM64."

      # ============================================================
      # 12. Collect packages
      # ============================================================
      - name: Collect build artifacts
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cd "$HOME/build"

          echo "=== Collecting FFmpeg packages ==="

          cp -v ffmpeg_*.deb \
            "$GITHUB_WORKSPACE/artifacts/"

          cp -v libavcodec58_*.deb \
            "$GITHUB_WORKSPACE/artifacts/"

          cp -v libavdevice58_*.deb \
            "$GITHUB_WORKSPACE/artifacts/"

          cp -v libavfilter7_*.deb \
            "$GITHUB_WORKSPACE/artifacts/"

          cp -v libavformat58_*.deb \
            "$GITHUB_WORKSPACE/artifacts/"

          cp -v libavutil56_*.deb \
            "$GITHUB_WORKSPACE/artifacts/"

          cp -v libpostproc55_*.deb \
            "$GITHUB_WORKSPACE/artifacts/"

          cp -v libswresample3_*.deb \
            "$GITHUB_WORKSPACE/artifacts/"

          cp -v libswscale5_*.deb \
            "$GITHUB_WORKSPACE/artifacts/"

          echo
          echo "=== Artifact directory ==="
          ls -lah "$GITHUB_WORKSPACE/artifacts"

      # ============================================================
      # 13. Upload packages
      # ============================================================
      - name: Upload FFmpeg DRM PRIME ARM64 packages
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-4.4.2-drmprime-forced-arm64
          path: artifacts/
          retention-days: 7
