name: Build FFmpeg DRM PRIME Diagnostic

on:
  workflow_dispatch:

jobs:
  build-ffmpeg:
    name: Build FFmpeg 4.4.2 DRM PRIME ARM64
    runs-on: ubuntu-22.04-arm

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ============================================================
      # 2. Verify runner architecture
      # ============================================================
      - name: Verify runner architecture
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo " SYSTEM INFORMATION"
          echo "========================================"

          uname -a

          echo
          echo "Machine:"
          uname -m

          echo
          echo "Debian architecture:"
          dpkg --print-architecture

          echo
          echo "CPU:"
          nproc

          echo
          echo "========================================"
          echo " VERIFYING ARM64"
          echo "========================================"

          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"

          echo
          echo "Runner is confirmed ARM64."

      # ============================================================
      # 3. Enable Debian source repositories
      # ============================================================
      - name: Enable source repositories
        shell: bash
        run: |
          set -eux

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i \
              's/^Types: deb$/Types: deb deb-src/' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi

          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i \
              's/^# *deb-src /deb-src /' \
              /etc/apt/sources.list
          fi

          echo
          echo "========================================"
          echo " SOURCE REPOSITORIES"
          echo "========================================"

          grep -R "deb-src" \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/ \
            || true

          sudo apt-get update

      # ============================================================
      # 4. Install build dependencies
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get build-dep -y ffmpeg

          sudo apt-get install -y \
            build-essential \
            devscripts \
            quilt \
            fakeroot \
            git \
            ca-certificates \
            curl \
            python3

      # ============================================================
      # 5. Download exact Ubuntu Jammy FFmpeg source
      # ============================================================
      - name: Download FFmpeg 4.4.2 source
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/build"

          cd "$HOME/build"

          apt-get source ffmpeg=7:4.4.2-0ubuntu0.22.04.1

          echo
          echo "========================================"
          echo " DOWNLOADED SOURCE"
          echo "========================================"

          ls -lah

          test -d ffmpeg-4.4.2

      # ============================================================
      # 6. Verify exact FFmpeg source version
      # ============================================================
      - name: Verify FFmpeg source version
        shell: bash
        run: |
          set -eux

          cd "$HOME/build/ffmpeg-4.4.2"

          VERSION="$(dpkg-parsechangelog \
            -S Version \
            -l debian/changelog)"

          echo
          echo "FFmpeg source version:"
          echo "$VERSION"

          test "$VERSION" = "7:4.4.2-0ubuntu0.22.04.1"

          echo
          echo "Correct Ubuntu Jammy FFmpeg source."

      # ============================================================
      # 7. Download LibreELEC V4L2 DRM PRIME patch
      # ============================================================
      - name: Download V4L2 DRM PRIME patch
        shell: bash
        run: |
          set -eux

          cd "$HOME/build/ffmpeg-4.4.2"

          export QUILT_PATCHES=debian/patches

          mkdir -p debian/patches

          curl -fL \
            -o debian/patches/v4l2-drmprime.patch \
            https://raw.githubusercontent.com/LibreELEC/LibreELEC.tv/libreelec-11.0/packages/multimedia/ffmpeg/patches/v4l2-drmprime/ffmpeg-001-v4l2-drmprime.patch

          echo
          echo "========================================"
          echo " DRM PRIME PATCH"
          echo "========================================"

          ls -lh debian/patches/v4l2-drmprime.patch

          test -s debian/patches/v4l2-drmprime.patch

          echo "v4l2-drmprime.patch" >> debian/patches/series

          echo
          echo "Patch series:"
          cat debian/patches/series

          echo
          echo "Applying patch..."

          quilt push

          echo
          echo "Applied patches:"
          quilt applied

      # ============================================================
      # 8. Force FFmpeg CLI to select DRM PRIME
      #
      # This modification is ONLY for the standalone ffmpeg CLI.
      #
      # Kodi does not use fftools/ffmpeg.c.
      #
      # The actual Kodi/V4L2 DRM PRIME capability comes from the
      # LibreELEC patch applied above.
      # ============================================================
      - name: Force DRM PRIME in ffmpeg CLI
        shell: bash
        run: |
          set -eux

          cd "$HOME/build/ffmpeg-4.4.2"

          python3 <<'PY'
          from pathlib import Path

          path = Path("fftools/ffmpeg.c")
          text = path.read_text()

          needle = """static enum AVPixelFormat get_format(AVCodecContext *s, const enum AVPixelFormat *pix_fmts)
          {
              InputStream *ist = s->opaque;
              const enum AVPixelFormat *p;
              int ret;
          """

          insert = """    for (p = pix_fmts; *p != AV_PIX_FMT_NONE; p++) {
              if (*p == AV_PIX_FMT_DRM_PRIME) {
                  av_log(s, AV_LOG_INFO, "TEST: forcing DRM_PRIME\\\\n");
                  return AV_PIX_FMT_DRM_PRIME;
              }
          }

          """

          if "TEST: forcing DRM_PRIME" in text:
              raise SystemExit(
                  "ERROR: DRM PRIME force code already exists. "
                  "Refusing to insert twice."
              )

          if needle not in text:
              raise SystemExit(
                  "ERROR: Could not find expected get_format() "
                  "function body. Refusing to modify source."
              )

          text = text.replace(
              needle,
              needle + insert,
              1
          )

          path.write_text(text)
          PY

          echo
          echo "========================================"
          echo " FORCED DRM PRIME CODE"
          echo "========================================"

          grep -n -A10 -B4 \
            "TEST: forcing DRM_PRIME" \
            fftools/ffmpeg.c

      # ============================================================
      # 9. Verify source modifications
      # ============================================================
      - name: Verify source modifications
        shell: bash
        run: |
          set -eux

          cd "$HOME/build/ffmpeg-4.4.2"

          echo
          echo "========================================"
          echo " APPLIED PATCHES"
          echo "========================================"

          quilt applied

          echo
          echo "========================================"
          echo " V4L2 DRM PRIME REFERENCES"
          echo "========================================"

          grep -n -E \
            "DRM_PRIME|drm_prime|v4l2.*drm" \
            libavcodec/v4l2_m2m_dec.c \
            libavcodec/v4l2_context.c \
            libavcodec/v4l2_buffers.c

          echo
          echo "========================================"
          echo " FORCED DRM PRIME"
          echo "========================================"

          grep -n -A8 -B4 \
            "TEST: forcing DRM_PRIME" \
            fftools/ffmpeg.c

          echo
          echo "========================================"
          echo " SANITY CHECKS"
          echo "========================================"

          grep -q \
            "TEST: forcing DRM_PRIME" \
            fftools/ffmpeg.c

          grep -q \
            "AV_PIX_FMT_DRM_PRIME" \
            libavcodec/v4l2_m2m_dec.c

          echo
          echo "Source modifications verified."

      # ============================================================
      # 10. Build Debian packages
      # ============================================================
      - name: Build FFmpeg packages
        shell: bash
        run: |
          set -eux

          cd "$HOME/build/ffmpeg-4.4.2"

          export DEB_BUILD_OPTIONS="parallel=4"

          echo
          echo "========================================"
          echo " BUILDING FFmpeg"
          echo "========================================"

          dpkg-buildpackage \
            -b \
            -uc \
            -us

      # ============================================================
      # 11. Verify generated Debian packages
      #
      # Native packages MUST be arm64.
      #
      # Documentation/data packages may be "all".
      # Those are architecture-independent and are OK.
      # ============================================================
      - name: Verify generated packages
        shell: bash
        run: |
          set -eux

          cd "$HOME/build"

          echo
          echo "========================================"
          echo " GENERATED PACKAGES"
          echo "========================================"

          ls -lh *.deb

          echo
          echo "========================================"
          echo " PACKAGE ARCHITECTURES"
          echo "========================================"

          for pkg in *.deb; do

            PACKAGE="$(dpkg-deb -f "$pkg" Package)"
            VERSION="$(dpkg-deb -f "$pkg" Version)"
            ARCH="$(dpkg-deb -f "$pkg" Architecture)"

            echo
            echo "----------------------------------------"
            echo "File:         $pkg"
            echo "Package:      $PACKAGE"
            echo "Version:      $VERSION"
            echo "Architecture: $ARCH"

          done

          echo
          echo "========================================"
          echo " VERIFYING ARCHITECTURES"
          echo "========================================"

          for pkg in *.deb; do

            PACKAGE="$(dpkg-deb -f "$pkg" Package)"
            ARCH="$(dpkg-deb -f "$pkg" Architecture)"

            if [ "$ARCH" = "all" ]; then
              echo "OK: $PACKAGE is architecture-independent."
              continue
            fi

            if [ "$ARCH" != "arm64" ]; then
              echo
              echo "ERROR:"
              echo "$pkg"
              echo "Architecture = $ARCH"
              echo "Expected      = arm64"
              exit 1
            fi

            echo "OK: $PACKAGE is arm64."

          done

          echo
          echo "========================================"
          echo " ARCHITECTURE CHECK PASSED"
          echo "========================================"

      # ============================================================
      # 12. Collect ONLY packages required for ARM64 test
      #
      # ffmpeg-doc is intentionally excluded.
      # ============================================================
      - name: Collect required ARM64 packages
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cd "$HOME/build"

          echo
          echo "========================================"
          echo " COLLECTING PACKAGES"
          echo "========================================"

          for pkg in \
            ffmpeg_*.deb \
            libavcodec58_*.deb \
            libavdevice58_*.deb \
            libavfilter7_*.deb \
            libavformat58_*.deb \
            libavutil56_*.deb \
            libpostproc55_*.deb \
            libswresample3_*.deb \
            libswscale5_*.deb
          do

            ARCH="$(dpkg-deb -f "$pkg" Architecture)"

            if [ "$ARCH" != "arm64" ]; then
              echo
              echo "ERROR:"
              echo "$pkg is $ARCH"
              echo "Required package must be arm64."
              exit 1
            fi

            cp -v \
              "$pkg" \
              "$GITHUB_WORKSPACE/artifacts/"

          done

          echo
          echo "========================================"
          echo " FINAL ARTIFACT"
          echo "========================================"

          ls -lah "$GITHUB_WORKSPACE/artifacts"

      # ============================================================
      # 13. Final artifact architecture verification
      # ============================================================
      - name: Verify final artifact
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/artifacts"

          echo
          echo "========================================"
          echo " FINAL ARM64 PACKAGE CHECK"
          echo "========================================"

          for pkg in *.deb; do

            ARCH="$(dpkg-deb -f "$pkg" Architecture)"

            echo "$pkg -> $ARCH"

            test "$ARCH" = "arm64"

          done

          echo
          echo "ALL FINAL PACKAGES ARE ARM64."

      # ============================================================
      # 14. Upload artifact
      # ============================================================
      - name: Upload FFmpeg DRM PRIME ARM64 packages
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-4.4.2-drmprime-forced-arm64
          path: artifacts/
          retention-days: 7
